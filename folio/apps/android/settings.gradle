// Maven Central through Google's mirror (the main host often rate-limits build machines).
pluginManagement {
    repositories { google(); maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); maven { url "https://maven-central.storage-download.googleapis.com/maven2/" } }
}
rootProject.name = "FundVault"
include ":app"
