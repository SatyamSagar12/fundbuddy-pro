name: Gateway check (temporary)
on:
  push:
    branches: ["claude/gateway-diagnose"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Find the database each live website uses
        run: |
          for site in https://fundbuddy-pro.lovable.app https://fundbuddy-pro.pages.dev; do
            echo "=== $site"
            curl -sS --compressed -m 20 -o page.html "$site/auth" || true
            grep -o '<title>[^<]*' page.html | head -1
            for js in $(grep -oE '/assets/[A-Za-z0-9_.~-]+\.js' page.html | sort -u); do
              curl -sS --compressed -m 20 "$site$js" | grep -oE '[a-z0-9]{20}\.supabase\.co|sb_publishable_[A-Za-z0-9_-]+|[a-z0-9-]+-api\.pages\.dev' | sort -u | sed "s#^#  $js: #"
            done
          done
          echo "=== settings of each candidate project"
          for ref in tojgfdjfmmnywjjrzdkn; do
            curl -sS -m 20 "https://$ref.supabase.co/auth/v1/settings" -H "apikey: sb_publishable_iNueS_IOeMlZy5a2QRsm7Q_Iqb3nj8h" | head -c 200; echo
          done
