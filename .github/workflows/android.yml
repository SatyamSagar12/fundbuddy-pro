# Builds the Android app (APK) on every push. Download it from the run's "Artifacts", or,
# for builds of the main branch, from the "android-latest" release on the Releases page.
name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Supabase settings come from the committed .env file.
      # Published website, used for links in sign-up e-mails sent from the app.
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://fundbuddy-pro.lovable.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the app's web files
        run: bun run build:mobile

      - name: Copy them into the Android project
        run: bunx cap sync android

      - name: Build the APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FundVault-Lite.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FundVault-Lite
          path: FundVault-Lite.apk
          if-no-files-found: error

      - name: Publish as the "android-latest" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "FundVault-Lite.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "FundVault Lite – Android app (latest build)" \
            --notes "Open this page on your Android phone, tap **FundVault-Lite.apk** to download it, then open the file to install. Android will ask you to allow installing apps from your browser the first time. Built from ${{ github.sha }} (version 1.0.${{ github.run_number }})."
