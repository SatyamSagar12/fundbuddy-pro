# Publishes the website to Cloudflare Pages (https://fundbuddy-pro.pages.dev) whenever main changes.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# Without them the workflow skips the upload and says so.
name: Cloudflare website

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "android/**"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase settings come from the committed .env file.
      NITRO_PRESET: cloudflare-pages
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish to Cloudflare Pages."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          bun-version: 1.4.2

      - name: Build the website for Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: bunx wrangler@4.151.3 pages deploy dist --project-name fundbuddy-pro --branch main --commit-hash "$GITHUB_SHA"
