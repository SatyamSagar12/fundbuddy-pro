# Publishes Anqulas Folio to Cloudflare in one go: database tables, Hyperdrive connection, secrets, the app.
# Run it from Actions -> "Publish Anqulas Folio" -> Run workflow. Safe to run again at any time.
#
# Repository secrets it needs (Settings -> Secrets and variables -> Actions -> New repository secret):
#   FOLIO_CLOUDFLARE_API_TOKEN  Cloudflare token: template "Edit Cloudflare Workers" plus Account -> Hyperdrive -> Edit
#   CLOUDFLARE_ACCOUNT_ID       already set for the old app
#   FOLIO_DATABASE_URL          Supabase (Mumbai) -> Connect -> Session pooler URL, with your database password in it
#   FOLIO_MASTER_KEY            any random text of 32+ characters. Keep a copy: without it PAN/bank details can't be read
#   FOLIO_SESSION_SECRET        another, different random text of 32+ characters
#   FOLIO_ADMIN_EMAIL           your email (opens /platform)
# Optional: FOLIO_UPI_ID (where plan payments go), FOLIO_SES_ACCESS_KEY_ID + FOLIO_SES_SECRET_ACCESS_KEY (email).
name: Publish Anqulas Folio

on:
  workflow_dispatch:
    inputs:
      approve_admins:
        description: "Also approve the admin email's sign-up (tick after you've signed up)"
        type: boolean
        default: false

concurrency:
  group: folio-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: folio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FOLIO_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.FOLIO_DATABASE_URL }}
      MASTER_KEY: ${{ secrets.FOLIO_MASTER_KEY }}
      SESSION_SECRET: ${{ secrets.FOLIO_SESSION_SECRET }}
      PLATFORM_ADMIN_EMAILS: ${{ secrets.FOLIO_ADMIN_EMAIL }}
      UPI_ID: ${{ secrets.FOLIO_UPI_ID }}
      SES_ACCESS_KEY_ID: ${{ secrets.FOLIO_SES_ACCESS_KEY_ID }}
      SES_SECRET_ACCESS_KEY: ${{ secrets.FOLIO_SES_SECRET_ACCESS_KEY }}
    steps:
      - name: Check the secrets are set
        working-directory: .
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL MASTER_KEY SESSION_SECRET PLATFORM_ADMIN_EMAILS; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets for:$missing (see the top of .github/workflows/folio-publish.yml)"
            exit 1
          fi
          for name in MASTER_KEY SESSION_SECRET; do
            if [ "$(printf %s "${!name}" | wc -c)" -lt 32 ]; then
              echo "::error::FOLIO_$name must be at least 32 characters"; exit 1
            fi
          done
          if [ "$MASTER_KEY" = "$SESSION_SECRET" ]; then echo "::error::FOLIO_MASTER_KEY and FOLIO_SESSION_SECRET must differ"; exit 1; fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: folio/package-lock.json
      - run: npm ci

      - name: Create or update the database tables
        run: npm run db:migrate

      - name: Connect Cloudflare to the database (Hyperdrive, caching off)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          list=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          if [ "$(echo "$list" | jq -r .success)" != "true" ]; then
            echo "::error::Cloudflare refused the token for Hyperdrive. Give the token Account -> Hyperdrive -> Edit."
            echo "$list" | jq -c .errors; exit 1
          fi
          id=$(echo "$list" | jq -r '.result[] | select(.name=="folio-db") | .id' | head -n1)
          if [ -z "$id" ]; then
            npx wrangler hyperdrive create folio-db --caching-disabled --connection-string="$DATABASE_URL"
            id=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result[] | select(.name=="folio-db") | .id' | head -n1)
          else
            npx wrangler hyperdrive update "$id" --caching-disabled --connection-string="$DATABASE_URL"
          fi
          [ -n "$id" ] || { echo "::error::Could not create the Hyperdrive connection"; exit 1; }
          sed -i "s/\"id\": \"00000000000000000000000000000000\"/\"id\": \"$id\"/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: Build and publish
        run: |
          jq -n '{MASTER_KEY: env.MASTER_KEY, SESSION_SECRET: env.SESSION_SECRET, PLATFORM_ADMIN_EMAILS: env.PLATFORM_ADMIN_EMAILS}
                 + (if env.UPI_ID != "" then {UPI_ID: env.UPI_ID} else {} end)
                 + (if env.SES_ACCESS_KEY_ID != "" then {SES_ACCESS_KEY_ID: env.SES_ACCESS_KEY_ID, SES_SECRET_ACCESS_KEY: env.SES_SECRET_ACCESS_KEY} else {} end)' \
            > "$RUNNER_TEMP/secrets.json"
          npm run build
          set +e
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          rm -f "$RUNNER_TEMP/secrets.json"
          if [ "$status" != "0" ]; then
            if grep -qi "workers.dev subdomain" "$RUNNER_TEMP/deploy.log"; then
              echo "::error::Open Cloudflare -> Workers & Pages once (it creates your free workers.dev address), then run this again."
            fi
            exit "$status"
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1)
          {
            echo "## Anqulas Folio is published"
            echo
            echo "Open: ${url:-see the log above}"
            echo
            echo "First time: sign up there with $PLATFORM_ADMIN_EMAILS, then run this workflow again with **Also approve the admin email** ticked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Approve the admin's sign-up
        if: inputs.approve_admins
        run: npx tsx scripts/approve-admins.ts
